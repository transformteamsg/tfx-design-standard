# Teachers & School domain profile.
# Values verified 2026-07-10 against standards/controls/col-1.md, typ-1.md,
# and CLAUDE.md. Brand PARAMETERS only — the rules stay in the catalog.

domain: teachers-school
name: Teachers & School
status: settled
owner: ""                        # design lead — TransformX T&S portfolio
products: [tw, casesync, glow]   # catalog meta.products
audiences: [teachers]            # catalog meta.audiences

colour:
  # This profile is the authoritative concrete declaration of per-product primaries;
  # COL-1 owns the behaviour.
  primaries:
    tw: "--tw-blue #0064FF"                      # Teacher & School Blue
    casesync: "--casesync Radix indigo-9 #3E63DD"  # proposed — awaiting design-lead settle (COL-1)
    glow: "--glow Radix orange-9 #F76B15"        # confirmed 2026-07-01 (COL-1); takes a DARK foreground, not white

typography:
  # Normative source: TYP-1.
  display: "Plus Jakarta Sans"
  body: "Inter"
  # Exact CSS family aliases used by the variable-font builds are declared too;
  # scanners never infer them by substring.
  allowed_families:
    - "Plus Jakarta Sans"
    - "Plus Jakarta Sans Variable"
    - "Inter"
    - "Inter Variable"
  display_weights: [600]
  body_weights: [400, 500, 600]
  # Formerly documented globally as the TFX type scale; this value belongs here.
  scale_px: [120, 96, 72, 48, 32, 24, 20, 18, 16, 14, 12, 11]
  wordmarks:
    glow: "Inria Sans (--font-logo) — wordmark/logo lockup only (TYP-1)"

# Foundation controls demand semantic tokens and declared scales (TOK-1..3) but
# never name a stack; the T&S stack is declared here.
stack:
  components: "Base UI components"
  colour_system: "Radix Colors"
  token_convention: "shadcn/ui default tokens"
  spacing_px: [0, 1, 2, 4, 6, 8, 10, 12, 14, 16, 20, 24, 28, 32, 36, 40, 44, 48, 56, 64, 80, 96, 112, 128]
  radius_px: [0, 2, 4, 6, 8, 12, 16, 24, 9999]

illustration:
  direction: ""                  # awaiting declaration
  sref: []

voice: "Kind Utility — useful first, kind at the surface (see the content skill's tone section)"
notes: ""
