# Routing eval dataset — does the right skill fire on these prompts?
#
# how_to_run:
#   probe: claude -p "<prompt>" --max-turns 2 --output-format stream-json --verbose --plugin-dir harness
#          — run in a FRESH session at the repo (worktree) root (a session that already
#          loaded a skill cannot measure triggering).
#   pass:  the expected skill name appears in the transcript's Skill tool calls
#          (a Skill tool invocation of that skill). For `expect: none`, pass means NO
#          harness skill (design / critique / copy / polish / motion / flow / layout /
#          standards / setup / feedback) appears in the tool calls. `start` is
#          user-invoked (disable-model-invocation: true) — it never fires from a prompt,
#          so it needs no case here.
#   cost cap: a full sweep is 67 headless sessions. Spot-check a 5-case sample per skill
#          edit (always include at least one modification-phrasing design case and one
#          `none` case); run the full sweep only when a skill's frontmatter `description:`
#          changes — that is the text that decides triggering.
#
# re-baseline (2026-07-03, plan 061 — operator's intent-shaped stack restructure):
#   - onboarding + setup cases: expect onboard -> setup (the onboard skill was renamed to
#     setup; it keeps both the setup and the onboarding triggers).
#   - "I don't like the empty state on the student notes page": expect design -> critique
#     (open dissatisfaction with an existing page and no named change is now critique's).
#   - added critique positives (review / what's wrong / improve / audit an existing page)
#     and critique/design/content/none boundary guards.
#   - added a critique-vs-content copy-improve tiebreak (061): a copy-only "improve" goes
#     to content, a page-level "improve" stays critique (critique disowns copy-only).
#
# re-baseline (2026-07-04, plan 062 — five focused passes; content dissolved into copy):
#   - the ~8 content cases now expect copy (content skill renamed to copy; it keeps every
#     content trigger, so copy-only asks still route there).
#   - added per-pass positives (polish / motion / flow / layout) and the pass boundary set:
#     a dimension-named ask goes to its pass; a whole-page "polish this" with no dimension
#     stays critique; a named change ("add a transition") stays design; a perf ask is none.
#     Watch cannibalisation both ways: passes must not steal critique's whole-page asks,
#     and critique must not steal a dimension-named pass ask.
#   - polish vs layout hierarchy tiebreak: visual/composition hierarchy (what draws the eye)
#     is layout's; type/weight hierarchy is polish's. Two tiebreak cases pin the split.
#
# expect ∈ design | critique | copy | polish | motion | flow | layout | standards | setup | feedback | none

cases:
  # ── design: new page / flow ─────────────────────────────────────────
  - prompt: "Design an attendance-taking page for Teacher Workspace"
    expect: design
  - prompt: "Build a parent-teacher meeting booking flow for TW"
    expect: design
  - prompt: "Create an empty state for the student notes list in CaseSync"
    expect: design
  - prompt: "We need a settings screen for notification preferences in Glow"
    expect: design
  - prompt: "Design a form for teachers to log a student incident"
    expect: design

  # ── design: modification of an existing surface ─────────────────────
  - prompt: "Add a remarks field to attendance"
    expect: design
  - prompt: "Restyle the status chip on the attendance page"
    expect: design
  - prompt: "Change the submit button on the marks page to show how many students are selected"
    expect: design
  - prompt: "Fix the error banner on the attendance page — it overlaps the header on small screens"
    expect: design
  - prompt: "Add a date picker to the homework assignment form"
    expect: design

  # ── design: catalog-update re-audit ──────────────────────────────────
  - prompt: "The catalog gained two new controls yesterday — re-check the attendance page against them"
    expect: design
  - prompt: "Re-audit the student notes page against the latest catalog"
    expect: design
  - prompt: "The standards catalog was updated; bring the attendance page back into compliance"
    expect: design

  # ── critique: evaluate / improve an existing page, no named change ───
  - prompt: "Review the attendance page"
    expect: critique
  - prompt: "What's wrong with this form?"
    expect: critique
  - prompt: "Improve the student notes page"
    expect: critique
  - prompt: "Audit this page against the standards"
    expect: critique

  # ── boundary guards: critique must NOT capture named changes, copy, or grading ──
  - prompt: "Add a remarks field to the student notes page"
    expect: design
  - prompt: "Rewrite the confirmation message on the delete-class dialog"
    expect: copy
  - prompt: "Grade the page the loop just produced"
    expect: none

  # ── critique vs copy: copy-improve tiebreak ──
  - prompt: "Improve the copy on the report-card form"
    expect: copy
  - prompt: "The wording on the attendance-marking page feels clunky — can you improve it?"
    expect: copy
  - prompt: "Improve the report-card form"
    expect: critique

  # ── copy: copy-only ────────────────────────────────────────────
  - prompt: "Rewrite this error message: 'Submission failed (code 0x1F4)'"
    expect: copy
  - prompt: "Is this empty-state text on-voice? 'No notes yet. Create one to get started.'"
    expect: copy
  - prompt: "Review the confirmation dialog copy on the marks page for tone"
    expect: copy
  - prompt: "Suggest a better label for this button — 'Execute submission' feels off"
    expect: copy
  - prompt: "Draft the success toast copy for when attendance is submitted"
    expect: copy

  # ── standards: catalog mechanics, waivers, proposals ─────────────
  - prompt: "Can I waive TOK-1 here?"
    expect: standards
  - prompt: "Propose a new control for table density based on the pilot finding"
    expect: standards
  - prompt: "Does CMP-2 apply to archiving a class, or only to deleting it?"
    expect: standards
  - prompt: "Write a waiver for the statutory programme name on the broadcast page"
    expect: standards

  # ── none: pure questions, no skill should fire ──────────────────────────
  - prompt: "What does L1 mean?"
    expect: none
  - prompt: "Summarise TFX-DS for a new team member"
    expect: none
  - prompt: "How many controls are in the catalog?"
    expect: none
  - prompt: "What is the brand essence of the Teacher & School portfolio?"
    expect: none
  - prompt: "Which pilot runs have been completed so far?"
    expect: none
  - prompt: "What fonts does the harness stack use?"
    expect: none

  # ── setup: onboarding + machine setup (was onboard) ──
  - prompt: "Onboard me to the TFX design harness"
    expect: setup
  - prompt: "I'm new to the harness — teach me how to use it"
    expect: setup
  - prompt: "Walk me through how the design loop works for the first time"
    expect: setup

  # ── boundary guards: onboarding must NOT capture design or pure-question intents ──
  - prompt: "How do I add a remarks field to the attendance page?"
    expect: design
  - prompt: "How do I design a settings screen for Glow?"
    expect: design

  # ── setup: tool-install branch ──
  - prompt: "Set up the TFX design harness on my machine"
    expect: setup
  - prompt: "Install the agent-browser CLI so the design loop can take screenshots"
    expect: setup
  - prompt: "The harness says capture isn't set up — install what it needs"
    expect: setup

  # ── boundary guards: setup wording must NOT capture design or generic installs ──
  - prompt: "Set up a new attendance page for Teacher Workspace"
    expect: design
  - prompt: "Install prettier and set up ESLint in this repo"
    expect: none

  # ── feedback: harness feedback, including mid-turn signals ──────────
  - prompt: "The plan gate keeps interrupting me for tiny copy changes — that's too much process"
    expect: feedback
  - prompt: "File this as harness feedback: the contrast check flagged a disabled button"
    expect: feedback
  - prompt: "The token-audit check missed a raw hex I snuck in — the harness should have caught it"
    expect: feedback

  # ── boundary guards: feedback must NOT capture product feedback or control proposals ──
  - prompt: "I don't like the empty state on the student notes page"
    expect: critique
  - prompt: "I think we need a new control banning full-width tables"
    expect: standards

  # ── focused passes: a dimension-named ask on an existing page goes to its pass ──
  - prompt: "Improve the copy on the marks page"
    expect: copy
  - prompt: "Polish the spacing on the marks page"
    expect: polish
  - prompt: "The type sizes on the attendance page look off — polish them"
    expect: polish
  - prompt: "Polish the motion on the attendance page"
    expect: motion
  - prompt: "The animations feel janky on save"
    expect: motion
  - prompt: "Tighten the layout of the student notes list"
    expect: layout
  - prompt: "The dashboard hierarchy is flat — tighten the layout"
    expect: layout
  - prompt: "This multi-step form loses my draft"
    expect: flow
  - prompt: "Improve the flow of the incident-report wizard — teachers get lost between steps"
    expect: flow

  # ── polish vs layout: hierarchy tiebreak (visual/composition hierarchy is layout's, type hierarchy is polish's) ──
  - prompt: "The visual hierarchy on the dashboard is weak"
    expect: layout
  - prompt: "The type hierarchy on the report card is flat — the headings don't stand out"
    expect: polish

  # ── boundary guards: pass vs critique (no dimension) / design (named change) / none (perf) ──
  - prompt: "Polish the attendance page"
    expect: critique
  - prompt: "Add a transition when the panel opens"
    expect: design
  - prompt: "Make the site load faster"
    expect: none
